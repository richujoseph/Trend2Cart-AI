# Render Blueprint (free plan): Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: trend2cart-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false  # e.g. https://your-app.vercel.app
      - key: LLM_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: TTS_PROVIDER
        value: sarvam
